name: phpstan

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/phpstan.yml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - '.github/workflows/phpstan.yml'

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: DEBUG peststan/extension state
        run: |
          echo "=== composer show mrpunyapal/peststan ==="
          composer show mrpunyapal/peststan 2>&1 | head -4 || echo "NOT INSTALLED"
          echo "=== peststan occurrences in GeneratedConfig ==="
          grep -c "mrpunyapal/peststan" vendor/phpstan/extension-installer/src/GeneratedConfig.php 2>&1 || echo "0"
          echo "=== peststan vendor dir ==="
          ls vendor/mrpunyapal/peststan/ 2>&1 || echo "ABSENT"
          echo "=== phpstan version + php ==="
          ./vendor/bin/phpstan --version 2>&1 | head -1
          php -v | head -1

      - name: Cache PHPStan results
        uses: actions/cache@v5
        with:
          path: .cache/phpstan/
          key: phpstan-result-cache-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}
          restore-keys: phpstan-result-cache-

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --no-interaction --memory-limit=2G
