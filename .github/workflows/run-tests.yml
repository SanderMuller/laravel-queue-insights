name: run-tests

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Stratified by coverage purpose rather than a full cross-product —
      # the 24-cell cross-product re-proved the same thing across middle
      # cells, regressed when packagist throttled parallel composer-update
      # passes, and routinely tipped one of the slow cells over the
      # per-cell `timeout-minutes` ceiling. Explicit-include list below
      # keeps the load-bearing combos (floor / ceiling / mid Laravel /
      # both drivers on the edges / LW3 backport) and drops everything
      # the middle cells were just duplicating.
      matrix:
        include:
          # Floor — lowest supported combo. Both drivers because the
          # predis/phpredis shim divergence is most likely to bite on the
          # constraint floor. Bumped from L11 to L12 because dev-only
          # `laravel/pao ^1.0` requires L12+. Package code itself still
          # supports L11 per `illuminate/* ^11||^12||^13` in composer.json.
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-lowest, redis-client: predis,   livewire-pin: '' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-lowest, redis-client: phpredis, livewire-pin: '' }

          # Ceiling — highest supported combo. Both drivers, same reason.
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable, redis-client: predis,   livewire-pin: '' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable, redis-client: phpredis, livewire-pin: '' }

          # Mid Laravel on PHP-ceiling × predis — covers the most common
          # current-production combo.
          - { php: '8.4', laravel: '12.*', testbench: '10.*', stability: prefer-stable, redis-client: predis,   livewire-pin: '' }

          # PHP-axis sanity: PHP 8.3 against the highest Laravel +
          # prefer-stable — catches PHP-version-only regressions that the
          # floor cell (which is also prefer-lowest) would mask.
          - { php: '8.3', laravel: '13.*', testbench: '11.*', stability: prefer-stable, redis-client: predis,   livewire-pin: '' }

          # Stability-axis sanity: prefer-lowest at the ceiling — catches
          # version-range mismatches the prefer-stable cells miss
          # (constraints that resolve OK at floor and ceiling separately
          # but conflict when one moves while the other stays put).
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-lowest, redis-client: predis,   livewire-pin: '' }

          # Mid Laravel × phpredis — keeps driver-shim coverage on the
          # middle Laravel without re-running the cross-product.
          - { php: '8.4', laravel: '12.*', testbench: '10.*', stability: prefer-stable, redis-client: phpredis, livewire-pin: '' }

          # Livewire 3 backport — the natural cross-product resolves to
          # Livewire 3.0 (prefer-lowest) and Livewire 4.x (prefer-stable);
          # this pin covers the v3-latest leg (operators on Livewire 3.7+
          # who haven't upgraded to v4 yet).
          - { php: '8.4', laravel: '12.*', testbench: '10.*', stability: prefer-stable, redis-client: predis,   livewire-pin: '^3.0' }

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.redis-client }}${{ matrix.livewire-pin && format(' - LW{0}', matrix.livewire-pin) || '' }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, redis, sqlite
          coverage: none

      # Node is required for the layer-2 XSS sink-execution test (see spec §3 +
      # Phase 3 + Resolved Q #17). Pinned to 22 (Maintenance LTS through 2027-04).
      # ubuntu-latest's default Node version is guaranteed to exist but not pinned
      # to a specific major — setup-node locks the runtime so a future runner image
      # bump can't silently change what the test runs against.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          if [ -n "${{ matrix.livewire-pin }}" ]; then
            composer require "livewire/livewire:${{ matrix.livewire-pin }}" --dev --no-interaction --no-update
          fi
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Cache PHPUnit results
        uses: actions/cache@v6
        with:
          path: .phpunit.cache/
          key: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('tests/**') }}
          restore-keys: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Execute tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
          # phpredis (ext-redis) and Predis have divergent signatures for SET+EX, MGET,
          # EVAL, XADD, and XREVRANGE. Matrix exercises both paths. See RedisEval + the
          # RedisClientParityTest.
          QI_REDIS_CLIENT: ${{ matrix.redis-client }}
        run: vendor/bin/pest --ci

  # Dedicated Redis Cluster lane. The package issues multi-key Lua scripts +
  # pipelines that Redis Cluster rejects with CROSSSLOT unless every key
  # hashes to one slot — `redis_cluster` hash-tag pinning + the
  # EagerCommandCollector pipeline fallback exist for exactly this. The
  # `cluster` test group exercises those paths against a real cluster;
  # `grokzen/redis-cluster` runs a 6-node (3 master / 3 replica) cluster in
  # one service container. Both drivers, since the cluster connection class
  # and the RedisEval / RedisPipeline branches diverge between them.
  test-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        redis-client: [predis, phpredis]

    name: cluster - ${{ matrix.redis-client }}

    services:
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          # grokzen's documented setting for reachability from the host
          # runner — the cluster nodes stay addressable via the mapped
          # 127.0.0.1:7000-7005 ports below.
          IP: 0.0.0.0
        ports:
          - 7000:7000
          - 7001:7001
          - 7002:7002
          - 7003:7003
          - 7004:7004
          - 7005:7005
        options: >-
          --health-cmd "redis-cli -p 7000 cluster info | grep -q cluster_state:ok"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Plain standalone Redis for the `default` connection. The cluster
      # tests target `cluster`, but TestCase still resolves `default`, and
      # phpredis connects eagerly — so it needs a real endpoint on 6379.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, redis, sqlite
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute cluster tests
        env:
          REDIS_CLUSTER_HOST: 127.0.0.1
          REDIS_CLUSTER_PORT: 7000
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
          QI_REDIS_CLIENT: ${{ matrix.redis-client }}
        run: vendor/bin/pest --group=cluster --ci
