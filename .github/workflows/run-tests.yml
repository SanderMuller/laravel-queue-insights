name: run-tests

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        redis-client: [predis, phpredis]
        # Empty default for `livewire-pin` keeps the cross-product on natural
        # resolver behaviour (prefer-lowest → Livewire 3.0; prefer-stable →
        # Livewire 4.x latest). The non-empty value on the explicit include
        # cell below means it does NOT match any cross-product cell (per
        # GitHub Actions matrix-include semantics, all matrix keys must
        # match for an include to merge), so it becomes an additional job.
        livewire-pin: ['']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Explicit "Livewire 3 latest" cell. The cross-product gives us:
          #   - prefer-lowest → Livewire 3.0    (v3 oldest)
          #   - prefer-stable → Livewire 4.x    (v4 latest)
          # The missing leg is v3-latest (operators on Livewire 3.7+ who
          # haven't upgraded yet). This pin forces composer to install a
          # ^3.0 release with prefer-stable, covering that path.
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable
            redis-client: predis
            livewire-pin: '^3.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.redis-client }}${{ matrix.livewire-pin && format(' - LW{0}', matrix.livewire-pin) || '' }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, redis, sqlite
          coverage: none

      # Node is required for the layer-2 XSS sink-execution test (see spec §3 +
      # Phase 3 + Resolved Q #17). Pinned to 22 (Maintenance LTS through 2027-04).
      # ubuntu-latest's default Node version is guaranteed to exist but not pinned
      # to a specific major — setup-node locks the runtime so a future runner image
      # bump can't silently change what the test runs against.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          if [ -n "${{ matrix.livewire-pin }}" ]; then
            composer require "livewire/livewire:${{ matrix.livewire-pin }}" --dev --no-interaction --no-update
          fi
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Cache PHPUnit results
        uses: actions/cache@v4
        with:
          path: .phpunit.cache/
          key: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('tests/**') }}
          restore-keys: phpunit-cache-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Execute tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
          # phpredis (ext-redis) and Predis have divergent signatures for SET+EX, MGET,
          # EVAL, XADD, and XREVRANGE. Matrix exercises both paths. See RedisEval + the
          # RedisClientParityTest.
          QI_REDIS_CLIENT: ${{ matrix.redis-client }}
        run: vendor/bin/pest --ci
